<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; manifest-src 'self'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Читанка</title>
<meta name="description" content="Читанка: фото сторінки, текст і читання вголос. Без входу.">
<meta name="theme-color" content="#fdf1e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Читанка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="css/reader.css">
</head>
<body>
<header class="top">
  <h1>Читанка</h1>
  <input class="title" id="bookTitle" type="text" maxlength="80" value="Моя книжка" aria-label="Назва книжки">
  <p class="info" id="pageInfo">Сторінок ще немає</p>
</header>

<main class="reader" id="reader">
  <img class="preview" id="preview" alt="" hidden>
  <article class="page-text" id="pageText"></article>
  <p class="empty" id="emptyHint">Відкрий книжку з фото сторінки. Текст розпізнається тут, на телефоні, і нікуди не надсилається. Можна також надіслати фото мені в чат — прочитаю вголос.</p>
  <p class="status" id="status" hidden></p>
</main>

<nav class="bar">
  <label class="btn primary">
    Додати фото
    <input id="filePages" type="file" accept="image/*" multiple hidden>
  </label>
  <button type="button" class="btn" id="bListen">Прослухати</button>
  <button type="button" class="btn" id="bBack">−15</button>
  <button type="button" class="btn" id="bFwd">+30</button>
  <button type="button" class="btn" id="bPrev">Попередня</button>
  <button type="button" class="btn" id="bNext">Наступна</button>
  <button type="button" class="btn" id="bMark">Закладка</button>
</nav>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
